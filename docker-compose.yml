# One-command local setup: `docker compose up --build`
# Local-only credentials; nothing here is used in production.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: restaurant
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d restaurant"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Runtime: non-owner app_user (RLS applies). Migrations: owner.
      DATABASE_URL: postgresql://app_user:app_user_local@db:5432/restaurant
      DIRECT_URL: postgresql://postgres:postgres@db:5432/restaurant
      APP_DB_PASSWORD: app_user_local
      PIN_PEPPER: local-dev-pin-pepper-not-for-production-0001
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
